server {
    listen 80;
    server_name localhost souqjo.com www.souqjo.com;

    client_max_body_size 100M;

    # توجيه الملفات الثابتة
    location /static/ {
        alias /app/static/;
    }

    # توجيه ملفات الوسائط والصور
    location /media/ {
        alias /app/media/;
    }

    # توجيه طلبات الذكاء الاصطناعي إلى خدمة FastAPI
    location /api/v1/ai/ {
        proxy_pass http://ai_service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # توجيه باقي طلبات الـ API إلى Django
    location / {
        proxy_pass http://backend_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}